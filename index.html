<!doctype html><html><head><meta charset=utf8><title>1박 2일 청춘여행</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>1박 2일 청춘여행</title><style id="css">
/* Layout: single column trip sheet — header, day-by-day schedule rows, then games/menu pair, then tour candidates */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --fg:#1c2921; --muted:#5d6b62; --line:#d8e0d9;
  --accent:#2e6a4e; --accent-soft:#e3eee7; --amber:#b9790f; --amber-soft:#fbf0dc; --danger:#b23b2e;
  --f-display:"Gowun Batang",ui-serif,Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1a221d; --fg:#e5ebe6; --muted:#9aa89f; --line:#2c3831;
  --accent:#72bb95; --accent-soft:#1f3329; --amber:#e3a643; --amber-soft:#33291a; --danger:#e87a6c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1a221d; --fg:#e5ebe6; --muted:#9aa89f; --line:#2c3831;
  --accent:#72bb95; --accent-soft:#1f3329; --amber:#e3a643; --amber-soft:#33291a; --danger:#e87a6c; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:28px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--f-display);font-size:30px;line-height:1.2;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.status{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.status.warn{background:var(--amber-soft);color:var(--amber)}
.status.err{background:var(--amber-soft);color:var(--danger)}
section{display:grid;gap:12px}
h2{font-family:var(--f-display);font-size:20px;margin:0;display:flex;align-items:baseline;gap:8px}
h2 small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.day-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.day-h span{color:var(--muted);font-weight:400;font-size:12px}
.row{display:grid;grid-template-columns:76px minmax(0,1.4fr) 76px minmax(0,1fr) 32px;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.row.head{font-size:11px;letter-spacing:.06em;color:var(--muted);padding-block:6px 4px}
input[type=text]{font:inherit;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 8px;width:100%;min-width:0;box-sizing:border-box}
input[type=text]:hover{border-color:var(--line)}
input[type=text]:focus{outline:none;border-color:var(--accent);background:var(--bg)}
input[type=text]::placeholder{color:var(--muted);opacity:.7}
input:disabled{opacity:1;cursor:default}
.t{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}
.who{font-size:13px}
.memo{font-size:13px;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:6px;width:30px;height:30px}
.x:hover{color:var(--danger);background:var(--bg)}
.add{border:1px dashed var(--line);background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:500;padding:8px;margin:8px 10px 10px;border-radius:8px;cursor:pointer;width:calc(100% - 20px)}
.add:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.empty{padding:14px;color:var(--muted);font-size:13px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start}
.li{display:grid;grid-template-columns:28px minmax(0,1fr) 32px;gap:4px;align-items:center;padding:4px 10px;border-bottom:1px solid var(--line)}
.li.game{grid-template-columns:28px minmax(0,1fr) 96px 32px}
.li.sub{font-size:11px;letter-spacing:.06em;color:var(--muted);padding-block:6px 2px}
.li.menu{grid-template-columns:minmax(0,1fr) 84px 32px}
.chk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--surface);font-size:12px;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.li.done input{text-decoration:line-through;color:var(--muted)}
.tours{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tour{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;align-content:start}
.tour.picked{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.tour h3{margin:0;font-family:var(--f-display);font-size:18px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.badge{font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--amber);background:var(--amber-soft);padding:2px 8px;border-radius:999px}
.tour p{margin:0;font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tour-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pick.on{background:var(--amber);border-color:var(--amber);color:var(--surface)}
.tour a{font-size:13px;color:var(--accent);margin-left:auto}
.note{font-size:12px;color:var(--muted)}
.tour-h{display:grid;grid-template-columns:minmax(0,1fr) auto 30px;gap:6px;align-items:center}
.tour input.tn{font-family:var(--f-display);font-size:18px;font-weight:700;padding:4px 6px}
.tour textarea{font:inherit;font-size:14px;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:6px;padding:6px;width:100%;box-sizing:border-box;resize:vertical;min-height:44px}
.tour input.tg{font-size:12px;color:var(--accent)}
.tour textarea:hover{border-color:var(--line)}
.tour textarea:focus{outline:none;border-color:var(--accent);background:var(--bg);color:var(--fg)}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tour-add{border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--accent);font:inherit;font-size:14px;font-weight:500;cursor:pointer;min-height:180px}
.tour-add:hover{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:600px){
  .row{grid-template-columns:64px minmax(0,1fr) 30px;grid-template-areas:"t w x" ". p m";row-gap:0}
  .row.head{display:none}
  .row>.t{grid-area:t}.row>.w{grid-area:w}.row>.x{grid-area:x}
  .row>.who{grid-area:p;max-width:90px}.row>.memo{grid-area:m}
  .row{grid-template-columns:64px minmax(0,1fr) 30px;grid-template-areas:"t w x" "p m m"}
  h1{font-size:26px}
}

.recipes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:8px;align-content:start}
.rc-h{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:6px;align-items:center}
.rc input.tn{font-family:var(--f-display);font-size:18px;font-weight:700;padding:4px 6px}
.rc-meta{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:6px}
.rc-meta input{font-size:12px;color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.06em;color:var(--accent);font-weight:600;padding-left:6px}
.rc textarea{font:inherit;font-size:13px;line-height:1.6;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:6px;width:100%;box-sizing:border-box;resize:vertical}
.rc textarea:hover{border-color:var(--line)}
.rc textarea:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.rc textarea.tip{background:var(--amber-soft);color:var(--amber);font-size:12px}
.li.shop{grid-template-columns:28px minmax(0,1fr) 84px 76px 32px}
.shop-c{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 4px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft)}
.shop-c span{font-weight:400;color:var(--muted)}
.add.sm{margin:4px 10px 8px;padding:5px;font-size:12px}
.qty{font-size:13px;color:var(--muted)}
@media (max-width:600px){.li.shop{grid-template-columns:28px minmax(0,1fr) 64px 30px}.li.shop>.who{display:none}}
:root{--c1:#dbe8fb;--c1f:#1f4f91;--c2:#fbe0ea;--c2f:#9c2858;--c3:#fbefd6;--c3f:#8a5a06;--c4:#dcefe3;--c4f:#226242;--c5:#ece7f6;--c5f:#55407f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#1e3049;--c1f:#9cc2f5;--c2:#3f2230;--c2f:#f2a6c2;--c3:#3a2e17;--c3f:#efc277;--c4:#1d3528;--c4f:#8fd4ad;--c5:#2c2740;--c5f:#c3b3ec}}
:root[data-theme="dark"]{--c1:#1e3049;--c1f:#9cc2f5;--c2:#3f2230;--c2f:#f2a6c2;--c3:#3a2e17;--c3f:#efc277;--c4:#1d3528;--c4f:#8fd4ad;--c5:#2c2740;--c5f:#c3b3ec}
select{font:inherit;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 4px;width:100%;min-width:0;box-sizing:border-box;cursor:pointer;-webkit-appearance:none;appearance:none}
select:hover{border-color:var(--line)}select:focus{outline:none;border-color:var(--accent)}
select option{color:#1c2921;background:#fff}
select.t{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);text-align:center}
select.who{font-size:12px;font-weight:600;text-align:center;text-align-last:center;border-radius:999px;padding:5px 6px}
.p0{color:var(--muted);border:1px dashed var(--line)!important;background:transparent}
.p1{background:var(--c1);color:var(--c1f)}.p2{background:var(--c2);color:var(--c2f)}.p3{background:var(--c3);color:var(--c3f)}.p4{background:var(--c4);color:var(--c4f)}.p5{background:var(--c5);color:var(--c5f)}
.row{grid-template-columns:24px 92px minmax(0,1.4fr) 86px minmax(0,1fr) 30px}
.grip{cursor:grab;color:var(--muted);touch-action:none;user-select:none;-webkit-user-select:none;display:grid;place-items:center;height:32px;font-size:14px;letter-spacing:-3px;border-radius:6px}
.grip:hover{background:var(--bg);color:var(--accent)}
.row.dragging{opacity:.35}
.drop-before{box-shadow:inset 0 3px 0 var(--accent)}.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}.dz.drop-end{box-shadow:0 0 0 2px var(--accent)}
body.dragging-on{user-select:none;-webkit-user-select:none;cursor:grabbing}
.combo{display:grid;grid-template-columns:minmax(0,1fr) 28px;align-items:center;min-width:0}
.cb{border:0;background:transparent;color:var(--accent);cursor:pointer;height:30px;border-radius:6px;font-size:13px}
.cb:hover{background:var(--accent-soft)}
#menu{position:fixed;z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:320px;overflow:auto;padding:4px;box-sizing:border-box}
#menu .g{font-size:11px;font-weight:600;color:var(--muted);padding:8px 10px 2px;letter-spacing:.04em}
#menu button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;background:transparent;border:0;color:var(--fg);padding:8px 10px;border-radius:6px;cursor:pointer}
#menu button:hover{background:var(--accent-soft)}
.mine{box-shadow:inset 3px 0 0 var(--accent)}
.rc.mine,.tour.mine{box-shadow:0 0 0 2px var(--accent)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.sm{font-size:18px;padding-block:3px}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent)}
.mebar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.chip{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{border-color:transparent}
.chip.toggle.on{background:var(--accent);color:var(--surface)}
.chip:disabled{opacity:.45;cursor:default}
.hint{font-size:12px}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn.cart{justify-self:start}
.smode .si{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px}
.smode .si .chk{width:26px;height:26px;flex:none}
.smode .si .q{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.smode .si.done{opacity:.5;text-decoration:line-through;font-size:14px;padding:8px 16px}
.smode .si.done .chk{width:20px;height:20px}
.empty.big{font-size:16px;text-align:center;padding:24px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:11;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
#toast button{background:transparent;border:0;color:var(--amber);font:inherit;font-weight:600;cursor:pointer;padding:0}
@media (max-width:600px){
  .row{grid-template-columns:22px 84px minmax(0,1fr) 30px;grid-template-areas:"g t w x" "g p m m";row-gap:2px}
  .row>.grip{grid-area:g;height:100%}.row>.t{grid-area:t}.row>.w{grid-area:w}.row>.x{grid-area:x}.row>.who{grid-area:p;max-width:none}.row>.memo{grid-area:m}
  .li.game{grid-template-columns:28px minmax(0,1fr) 80px 30px}
  .li.shop{grid-template-columns:28px minmax(0,1fr) 58px 72px 30px}
  .li.shop>.who{display:block}
}

.mb{display:none;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;height:30px;padding:0;font-size:14px}
@media (max-width:600px){
  .row{grid-template-columns:16px 54px minmax(0,1fr) 22px 48px 22px;grid-template-areas:none;gap:3px;padding:4px 6px;row-gap:0}
  .row>*{grid-area:auto!important}
  .row>.memo{display:none}
  .row.open>.memo{display:block;grid-area:2/3/3/7!important;margin-bottom:4px}
  .row.open>.mb{color:var(--accent)}
  .mb{display:block}
  .row .combo{grid-template-columns:minmax(0,1fr) 20px}
  .row .cb{width:20px;padding:0}
  .row select.t{padding:6px 0;font-size:16px}
  .row select.who{padding:4px 2px;font-size:12px}
  .row input.wi{padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grip{font-size:12px}
  input[type=text],select,textarea{font-size:16px}
  .row select.who{font-size:16px;letter-spacing:-.02em}
}

:root{--s0:#cfe6d8;--s1:#f6dcb4;--s2:#d6e2f6;--s3:#f3d3dc;--s4:#e2dcf3;--s5:#e6ecc8;--seg-ink:#1c2921}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s0:#2a4a39;--s1:#4f3d1f;--s2:#2a3a55;--s3:#4d2a36;--s4:#3a3256;--s5:#3d4527;--seg-ink:#e5ebe6}}
:root[data-theme="dark"]{--s0:#2a4a39;--s1:#4f3d1f;--s2:#2a3a55;--s3:#4d2a36;--s4:#3a3256;--s5:#3d4527;--seg-ink:#e5ebe6}
.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.clockp{padding:12px 12px 14px;display:grid;gap:10px;align-content:start}
.clock{width:100%;max-width:360px;justify-self:center;display:block}
.clock .face{fill:var(--bg);stroke:var(--line)}
.clock .seg{stroke:var(--surface);stroke-width:2}
.s0{fill:var(--s0);background:var(--s0)}.s1{fill:var(--s1);background:var(--s1)}.s2{fill:var(--s2);background:var(--s2)}.s3{fill:var(--s3);background:var(--s3)}.s4{fill:var(--s4);background:var(--s4)}.s5{fill:var(--s5);background:var(--s5)}
.clock .seg.me{stroke:var(--accent);stroke-width:3}
.clock .tick{stroke:var(--muted);stroke-width:1}
.clock .hr{font-size:12px;fill:var(--muted);text-anchor:middle;dominant-baseline:middle;font-variant-numeric:tabular-nums}
.clock .lb{font-size:11.5px;font-weight:600;fill:var(--seg-ink);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.clock .lb .lt{font-size:10px;font-weight:500;fill:var(--muted)}
.clock .lb.num{font-size:12px}
.clock .ctr{font-family:var(--f-display);font-size:18px;font-weight:700;fill:var(--fg);text-anchor:middle}
.clock .ctr2{font-size:12px;fill:var(--muted);text-anchor:middle}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.legend li{display:grid;grid-template-columns:22px 92px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;font-size:14px}
.legend li.mine{box-shadow:inset 3px 0 0 var(--accent)}
.legend .sw{width:20px;height:20px;border-radius:5px;font-style:normal;font-size:11px;font-weight:600;display:grid;place-items:center;color:var(--seg-ink)}
.legend .lt2{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.legend .ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}

.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--bg);padding:8px 0;margin:-12px 0 -16px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center;justify-content:center}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--accent);color:var(--surface)}
.tab em{font-style:normal;font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tab.on em{background:rgba(255,255,255,.22);color:var(--surface)}
.tabbody{display:grid;gap:28px;min-height:50vh;align-content:start}
.dtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.dtab{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;display:grid;gap:1px}
.dtab b{font-family:var(--f-display);font-size:16px}
.dtab span{font-size:12px;color:var(--muted)}
.dtab.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.dtab.drop-end{box-shadow:0 0 0 2px var(--accent)}
.stat[data-a]{cursor:pointer}.stat[data-a]:hover{border-color:var(--accent)}

// ---------- sync ----------
function arr(v){if(Array.isArray(v))return v.filter(function(x){return x!=null;});if(v&&typeof v==='object')return Object.keys(v).sort(function(a,b){return a-b;}).map(function(k){return v[k];});return [];}
function norm(d){d=d||{};var o={};o.title=d.title||S0.title;o.tpl=d.tpl||0;o.sub=d.sub||S0.sub;
  o.days=arr(d.days).map(function(x){return {label:x.label||'',date:x.date||'',items:arr(x.items).map(function(y){return {t:y.t||'',w:y.w||'',p:y.p||'',m:y.m||''};})};});
  if(!o.days.length)o.days=JSON.parse(JSON.stringify(S0.days));
  ['games','menu','tours','recipes','shop'].forEach(function(k){o[k]=arr(d[k]);});return o;}
function busy(){if(drag||menuKey)return true;var a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&app.contains(a);}
function apply(v){S=norm(v);if(busy()){pending=true;return;}render();}
function setStatus(t,k){statusTxt=t;statusKind=k||'';var el=document.getElementById('status');if(el){el.textContent=t;el.className='status '+statusKind;}}
function put(path,val){if(!live)return;setStatus('저장 중…','');
  fetch(DB+(path?'/'+path.replace(/\./g,'/'):'')+'.json',{method:'PUT',body:JSON.stringify(val==null?null:val)})
    .then(function(r){if(!r.ok)throw 0;setStatus('저장됨 · 모두에게 실시간 반영','');})
    .catch(function(){setStatus('저장 실패 · 다시 시도해 주세요','err');});}
function putCol(path){var c=path.split('.')[0];put(c,S[c]);}
function setAt(path,data,merge){var ks=path.split('/').filter(Boolean);if(!ks.length){if(merge){R=R||{};for(var k in data)R[k]=data[k];}else R=data;return;}
  R=R||{};var o=R;for(var i=0;i<ks.length-1;i++){if(o[ks[i]]==null||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]];}
  var last=ks[ks.length-1];if(merge){o[last]=o[last]||{};for(var k2 in data)o[last][k2]=data[k2];}else if(data==null)delete o[last];else o[last]=data;}

app.addEventListener('change',function(e){var k=e.target.getAttribute('data-k');if(!k)return;var v=e.target.value;setPath(k,v);

  else if(a==='addTour'){S.tours.push({n:'',d:'',tags:'',u:'',v:0,pk:false});col='tours';}
  else if(a==='vote'){S.tours[i].v=(S.tours[i].v||0)+1;col='tours';}
  else if(a==='pick'){var on=!S.tours[i].pk;S.tours.forEach(function(t){t.pk=false;});S.tours[i].pk=on;col='tours';}
  else if(a==='addRecipe'){S.recipes.push({n:'',p:newP(),srv:'',ing:'',st:'',tip:''});col='recipes';}
  else if(a==='togShop'){S.shop[i].d=!S.shop[i].d;col='shop';}
  else if(a==='addShop'){var c=b.getAttribute('data-c'),last=-1;S.shop.forEach(function(x,j){if(x.c===c)last=j;});S.shop.splice(last+1,0,{c:c,n:'',q:'',p:newP(),d:false});i=last+1;col='shop';}
  else return;
  render();put(col,S[col]);
  var f=null;
  if(a==='addItem')f=document.getElementById('d'+d+'-'+(S.days[d].items.length-1)+'-w');
  if(a==='addShop')f=document.getElementById('s'+i);
  if(a==='addRecipe')f=document.getElementById('r'+(S.recipes.length-1)+'-n');
  if(a==='addTour')f=document.getElementById('t'+(S.tours.length-1)+'-n');
  if(a==='addGame')f=document.getElementById('g'+(S.games.length-1));
  if(a==='addMenu')f=document.getElementById('m'+(S.menu.length-1)+'-n');
  if(f)f.focus();
});

// ---------- drag & drop (mouse + touch) ----------
function clearMark(){Array.prototype.forEach.call(app.querySelectorAll('.drop-before,.drop-after,.drop-end'),function(el){el.classList.remove('drop-before','drop-after','drop-end');});}
app.addEventListener('pointerdown',function(e){var g=e.target.closest('.grip');if(!g)return;e.preventDefault();
  var row=g.closest('.row');drag={d:+row.dataset.day,i:+row.dataset.idx,row:row,t:null};row.classList.add('dragging');document.body.classList.add('dragging-on');
  try{g.setPointerCapture(e.pointerId);}catch(x){}});
document.addEventListener('pointermove',function(e){if(!drag)return;e.preventDefault();clearMark();drag.t=null;
  var el=document.elementFromPoint(e.clientX,e.clientY);if(!el)return;
  var row=el.closest('.row[data-idx]');
  if(row&&row!==drag.row){var r=row.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;drag.t={d:+row.dataset.day,i:+row.dataset.idx+(after?1:0)};row.classList.add(after?'drop-after':'drop-before');}
  else if(!row){var dz=el.closest('.dz');if(dz){var dd=+dz.dataset.day;drag.t={d:dd,i:S.days[dd].items.length};dz.classList.add('drop-end');}}
  if(e.clientY<70)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-70)window.scrollBy(0,14);},{passive:false});
function endDrag(){if(!drag)return;var t=drag.t,d=drag.d,i=drag.i;clearMark();document.body.classList.remove('dragging-on');drag.row.classList.remove('dragging');drag=null;
  if(!t||(t.d===d&&(t.i===i||t.i===i+1))){if(pending){pending=false;render();}return;}
  var it=S.days[d].items.splice(i,1)[0],ti=t.i;if(t.d===d&&ti>i)ti--;S.days[t.d].items.splice(ti,0,it);pending=false;render();put('days',S.days);}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

// ---------- start ----------
render();
if(!live||!window.EventSource){setStatus('저장 서버 미연결 · 이 화면에서만 수정됨','warn');}
else{var first=true,es=new EventSource(DB+'.json');
  function onEv(merge){return function(e){var m;try{m=JSON.parse(e.data);}catch(x){return;}if(!m)return;
    if(first&&m.path==='/'&&m.data==null){first=false;R=JSON.parse(JSON.stringify(S0));put('',S0);setStatus('실시간 공유 중','');migrate();return;}
    var wasFirst=first;first=false;setAt(m.path,m.data,merge);apply(R);if(wasFirst)migrate();setStatus('실시간 공유 중','');};}
  es.addEventListener('put',onEv(false));es.addEventListener('patch',onEv(true));
  es.onerror=function(){setStatus('연결 끊김 · 재연결 중…','warn');};}
})();
</script></body></html>
